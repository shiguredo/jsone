name: ci

on:
  push:
    paths-ignore:
      - "LICENSE"
      - "**.md"

jobs:
  # prek.toml のフックをすべて実行する (efmt / efmt-check / elint など)
  check:
    runs-on: ubuntu-slim
    # prek の hook 環境準備 (初回や cache miss) を見込んで余裕を持たせる
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  ci:
    # dialyzer の PLT 生成に CPU と時間を使うため、1 vCPU で 15 分の実行制限がある
    # ubuntu-slim ではなく ubuntu-24.04 を使う
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # ビルド済みの Erlang/OTP 29.0.6 + AWS-LC v5.8.0 を使う
      # (rebar.config の minimum_otp_vsn は 28.1)
      - uses: shiguredo/setup-erlang@main
        with:
          otp-version: "29.0.6"
          aws-lc-version: "v5.8.0"

      - run: make compile dialyzer test proper

  slack_notify:
    needs: [check, ci]
    runs-on: ubuntu-slim
    if: ${{ always() }}
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: ${{ secrets.SLACK_INTERNAL_CHANNEL }}
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
