name: ci

on:
  push:
    paths-ignore:
      - "LICENSE"
      - "**.md"

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/shiguredo/erlang:otp-28.1-openssl-3.6.0-beta1-ubuntu-24.04-x86_64
    steps:
      - uses: actions/checkout@v4
      - run: make compile dialyzer test proper

  slack_notify:
    needs: [ci]
    runs-on: ubuntu-slim
    if: ${{ always() }}
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: ${{ secrets.SLACK_INTERNAL_CHANNEL }}
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
